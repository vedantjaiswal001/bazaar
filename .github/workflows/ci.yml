name: CI

# Every push and PR reruns the whole proof on a clean machine, from scratch.
# The badge is green only if 93 tests pass, the benchmark reproduces with zero
# escapes, the AP2 rail is conformant, the fuzzer finds zero violations, and the
# frontend builds. This is what makes "every number reproduces from a command"
# checkable by anyone, without cloning.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reproduce the proof (gate + tests + benchmark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up the project (venv + install + init db)
        run: make setup

      - name: Lint (ruff)
        run: make lint

      - name: Full test suite (unit + property + security + integration)
        run: make test

      - name: Benchmark scoreboard (non-zero exit on any escape)
        run: make benchmark

      - name: AP2 rail conformance (1/1 legit, 5/5 tampers)
        run: make ap2

      - name: Spend-cap fuzzer (non-zero exit on any violation)
        run: make fuzz

  frontend:
    name: Build the console (React + TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (clean, from lockfile)
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
