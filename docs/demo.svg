<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" role="img" aria-label="make showcase: a purchase clears the gate, a tampered receipt fails, nine attacks are blocked, the audit chain detects tampering, and the honest scoreboard prints">
  <!-- window -->
  <rect x="4" y="4" width="892" height="612" rx="16" fill="#FFFFFF" stroke="#DCE0E6" stroke-width="1.5"/>
  <rect x="4" y="4" width="892" height="44" rx="16" fill="#F4F6F9"/>
  <rect x="4" y="28" width="892" height="20" fill="#F4F6F9"/>
  <line x1="4" y1="48" x2="896" y2="48" stroke="#EBECF0" stroke-width="1"/>
  <circle cx="28" cy="26" r="6" fill="#F1C6CC"/><circle cx="48" cy="26" r="6" fill="#EAD3AC"/><circle cx="68" cy="26" r="6" fill="#B7E6CB"/>
  <text x="450" y="31" text-anchor="middle" font-size="13" font-weight="600" fill="#8993A4" letter-spacing="0.4">make showcase</text>

  <g font-family="'IBM Plex Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15">
    <!-- command -->
    <text x="30" y="82" fill="#8993A4">$</text>
    <text x="48" y="82" fill="#172B4D" font-weight="700">make showcase</text>

    <!-- beat 1 -->
    <text x="30" y="120" fill="#0B74C4" font-weight="700">BEAT 1  legitimate purchase</text>
    <text x="48" y="146" fill="#5E6C84">negotiated <tspan fill="#172B4D" font-weight="700">₹4,124.75</tspan>   gate <tspan fill="#0A8F54" font-weight="700">ALLOW</tspan> (11/11)   receipt <tspan fill="#0A8F54" font-weight="700">VALID</tspan></text>

    <!-- beat 2 -->
    <text x="30" y="182" fill="#0B74C4" font-weight="700">BEAT 2  tamper the receipt</text>
    <text x="48" y="208" fill="#5E6C84">amount 449900 -&gt; 999999   verify() -&gt; <tspan fill="#D64550" font-weight="700">INVALID</tspan></text>

    <!-- beat 3 -->
    <text x="30" y="244" fill="#0B74C4" font-weight="700">BEAT 3  nine attacks, nine reason codes</text>
    <text x="48" y="270" fill="#5E6C84"><tspan fill="#D64550" font-weight="700">BLOCK</tspan> MANDATE_LIMIT_EXCEEDED       <tspan fill="#D64550" font-weight="700">BLOCK</tspan> CATEGORY_OUTSIDE_MANDATE</text>
    <text x="48" y="294" fill="#5E6C84"><tspan fill="#D64550" font-weight="700">BLOCK</tspan> MANDATE_IMMUTABLE            <tspan fill="#D64550" font-weight="700">BLOCK</tspan> UNTRUSTED_INSTRUCTION</text>
    <text x="48" y="318" fill="#5E6C84"><tspan fill="#D64550" font-weight="700">BLOCK</tspan> PRICE_MISMATCH_MERCHANT_REC  <tspan fill="#D64550" font-weight="700">BLOCK</tspan> AGENT_FROZEN</text>
    <text x="48" y="342" fill="#5E6C84"><tspan fill="#D64550" font-weight="700">BLOCK</tspan> NONCE_REPLAY                 <tspan fill="#D64550" font-weight="700">BLOCK</tspan> MANDATE_EXPIRED</text>
    <text x="48" y="366" fill="#5E6C84"><tspan fill="#D64550" font-weight="700">BLOCK</tspan> DUPLICATE_TRANSACTION</text>

    <!-- beat 4 -->
    <text x="30" y="402" fill="#0B74C4" font-weight="700">BEAT 4  hash-chained audit log</text>
    <text x="48" y="428" fill="#5E6C84">edit entry seq=4   verify_chain() -&gt; <tspan fill="#D64550" font-weight="700">broken_at_seq=4</tspan></text>

    <!-- beat 5 -->
    <text x="30" y="464" fill="#0B74C4" font-weight="700">BEAT 5  the honest scoreboard</text>
  </g>

  <!-- scoreboard chips -->
  <g transform="translate(48,482)">
    <rect x="0" y="0" width="188" height="52" rx="10" fill="#E4F6ED" stroke="#B7E6CB"/>
    <text x="16" y="24" font-size="20" font-weight="800" fill="#0A8F54" font-family="'IBM Plex Mono',monospace">100%</text>
    <text x="16" y="42" font-size="12" fill="#3B7A5A">attacks blocked</text>

    <rect x="204" y="0" width="188" height="52" rx="10" fill="#E4F6ED" stroke="#B7E6CB"/>
    <text x="220" y="24" font-size="20" font-weight="800" fill="#0A8F54" font-family="'IBM Plex Mono',monospace">0%</text>
    <text x="220" y="42" font-size="12" fill="#3B7A5A">false-block on legit</text>

    <rect x="408" y="0" width="188" height="52" rx="10" fill="#E4F6ED" stroke="#B7E6CB"/>
    <text x="424" y="24" font-size="20" font-weight="800" fill="#0A8F54" font-family="'IBM Plex Mono',monospace">0</text>
    <text x="424" y="42" font-size="12" fill="#3B7A5A">escapes / 20k fuzzed</text>

    <rect x="612" y="0" width="188" height="52" rx="10" fill="#E7F3FE" stroke="#B8DEFB"/>
    <text x="628" y="24" font-size="20" font-weight="800" fill="#0D94FB" font-family="'IBM Plex Mono',monospace">+7.72%</text>
    <text x="628" y="42" font-size="12" fill="#0B74C4">AOV, all cleared</text>
  </g>

  <text x="48" y="576" font-size="13" fill="#8993A4" font-family="'IBM Plex Mono',monospace">one command · every number computed live · nothing mocked</text>
</svg>
