<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" role="img" aria-label="BAZAAR - a deterministic authorization gate for AI-to-AI commerce">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052a5c"/>
      <stop offset="0.5" stop-color="#012652"/>
      <stop offset="1" stop-color="#03132e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC5FF"/>
      <stop offset="0.5" stop-color="#0D94FB"/>
      <stop offset="1" stop-color="#0B6FBE"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BEE1FF"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#0D94FB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0D94FB" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="6" y="6" width="1268" height="588" rx="26" fill="url(#bg)" stroke="#12406f" stroke-width="1.5"/>
  <ellipse cx="1060" cy="60" rx="380" ry="230" fill="url(#glowBlue)" opacity="0.55"/>
  <ellipse cx="150" cy="560" rx="300" ry="170" fill="url(#glowBlue)" opacity="0.20"/>

  <!-- header -->
  <g transform="translate(60,64)">
    <rect x="0" y="8" width="46" height="46" rx="11" fill="url(#blue)"/>
    <text x="23" y="42" text-anchor="middle" font-size="30" font-weight="800" fill="#02234a">B</text>
    <text x="64" y="52" font-size="88" font-weight="800" letter-spacing="1.5" fill="url(#word)">BAZAAR</text>
  </g>
  <rect x="66" y="126" width="132" height="4" rx="2" fill="url(#blue)"/>
  <text x="66" y="168" font-size="27" font-weight="600" fill="#EAF2FB">A deterministic authorization gate for AI-to-AI commerce</text>
  <text x="66" y="202" font-size="17" fill="#9DB6D4">LLMs propose  ·  policies constrain  ·  a deterministic verifier authorizes  ·  nothing probabilistic can widen authority</text>

  <!-- test-mode pill -->
  <g transform="translate(1006,58)">
    <rect x="0" y="0" width="204" height="34" rx="17" fill="#08325f" stroke="#1d5c96"/>
    <circle cx="22" cy="17" r="5" fill="#34D399"/>
    <text x="38" y="22" font-size="13.5" font-weight="700" fill="#BFE0FF" letter-spacing="1.2">RAZORPAY TEST MODE</text>
  </g>

  <!-- pipeline -->
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <line x1="150" y1="300" x2="1130" y2="300" stroke="#1a4877" stroke-width="2"/>
    <g stroke="#2a68a0" stroke-width="2" fill="none">
      <path d="M256 300 h36"/><path d="M486 300 h36"/><path d="M760 300 h36"/><path d="M990 300 h36"/>
    </g>
    <g fill="#0D94FB">
      <path d="M292 294 l10 6 l-10 6 z"/><path d="M522 294 l10 6 l-10 6 z"/>
      <path d="M796 294 l10 6 l-10 6 z"/><path d="M1026 294 l10 6 l-10 6 z"/>
    </g>

    <!-- node 1 -->
    <g transform="translate(60,258)">
      <rect width="196" height="84" rx="14" fill="#082c58" stroke="#17457a"/>
      <text x="98" y="34" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7FA6D4">LLM / PARSER</text>
      <text x="98" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#EAF2FB">proposes a draft</text>
    </g>
    <!-- node 2 -->
    <g transform="translate(302,258)">
      <rect width="196" height="84" rx="14" fill="#082c58" stroke="#17457a"/>
      <text x="98" y="34" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7FA6D4">HUMAN</text>
      <text x="98" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#EAF2FB">signs (Ed25519)</text>
    </g>
    <!-- node 3 - THE GATE (highlighted) -->
    <g transform="translate(536,244)">
      <rect x="-8" y="-8" width="224" height="116" rx="20" fill="url(#glowBlue)" filter="url(#soft)"/>
      <rect width="208" height="100" rx="16" fill="#06305f" stroke="#0D94FB" stroke-width="2.5"/>
      <text x="104" y="34" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1.4" fill="#5AB8FF">DETERMINISTIC GATE</text>
      <text x="104" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">authorizes</text>
      <g transform="translate(0,74)">
        <rect x="34" y="0" width="62" height="22" rx="11" fill="#06331f" stroke="#1f8a4d"/>
        <text x="65" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#5DE6A0">ALLOW</text>
        <rect x="112" y="0" width="62" height="22" rx="11" fill="#3a1618" stroke="#9a3138"/>
        <text x="143" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#FF9098">BLOCK</text>
      </g>
    </g>
    <!-- node 4 -->
    <g transform="translate(796,258)">
      <rect width="196" height="84" rx="14" fill="#082c58" stroke="#17457a"/>
      <text x="98" y="34" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7FA6D4">RAZORPAY</text>
      <text x="98" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#EAF2FB">executes (test)</text>
    </g>
    <!-- node 5 -->
    <g transform="translate(1030,258)">
      <rect width="196" height="84" rx="14" fill="#082c58" stroke="#17457a"/>
      <text x="98" y="34" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7FA6D4">RECEIPT + LOG</text>
      <text x="98" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#EAF2FB">signed, chained</text>
    </g>
  </g>

  <!-- stat chips -->
  <g transform="translate(60,404)">
    <g transform="translate(0,0)">
      <rect width="278" height="96" rx="16" fill="#07244b" stroke="#164680"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="url(#blue)">100%</text>
      <text x="24" y="78" font-size="14.5" fill="#9DB6D4">attacks blocked · 9 classes</text>
    </g>
    <g transform="translate(298,0)">
      <rect width="278" height="96" rx="16" fill="#07244b" stroke="#164680"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="url(#blue)">0%</text>
      <text x="24" y="78" font-size="14.5" fill="#9DB6D4">false-block on legit traffic</text>
    </g>
    <g transform="translate(596,0)">
      <rect width="278" height="96" rx="16" fill="#07244b" stroke="#164680"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="url(#blue)">0</text>
      <text x="24" y="78" font-size="14.5" fill="#9DB6D4">escapes · 20k fuzzed states</text>
    </g>
    <g transform="translate(894,0)">
      <rect width="278" height="96" rx="16" fill="#07244b" stroke="#164680"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="url(#blue)">9</text>
      <text x="24" y="78" font-size="14.5" fill="#9DB6D4">machine-readable reason codes</text>
    </g>
  </g>

  <!-- footer ribbon -->
  <text x="640" y="556" text-anchor="middle" font-size="14.5" fill="#6E89AC" letter-spacing="0.4">Razorpay AI Buildathon 2026  ·  Track 01  ·  Ed25519 + RFC 8785  ·  FastAPI · SQLite · React  ·  every number reproduced by a command</text>
</svg>
