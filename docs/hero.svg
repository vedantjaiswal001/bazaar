<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" role="img" aria-label="BAZAAR - a deterministic authorization gate for AI-to-AI commerce">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#0D94FB" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0D94FB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- panel -->
  <rect x="6" y="6" width="1268" height="588" rx="26" fill="#FFFFFF" stroke="#DCE0E6" stroke-width="1.5"/>
  <ellipse cx="1080" cy="70" rx="360" ry="220" fill="url(#glow)"/>
  <rect x="6" y="6" width="1268" height="5" rx="2.5" fill="#0D94FB"/>

  <!-- header -->
  <g transform="translate(60,64)">
    <rect x="0" y="8" width="46" height="46" rx="11" fill="#0D94FB"/>
    <text x="23" y="42" text-anchor="middle" font-size="30" font-weight="800" fill="#FFFFFF">B</text>
    <text x="64" y="52" font-size="88" font-weight="800" letter-spacing="1.5" fill="#012652">BAZAAR</text>
  </g>
  <rect x="66" y="126" width="132" height="4" rx="2" fill="#0D94FB"/>
  <text x="66" y="168" font-size="27" font-weight="600" fill="#172B4D">A deterministic authorization gate for AI-to-AI commerce</text>
  <text x="66" y="202" font-size="17" fill="#5E6C84">LLMs propose  ·  policies constrain  ·  a deterministic verifier authorizes  ·  nothing probabilistic can widen authority</text>

  <!-- test-mode pill -->
  <g transform="translate(1006,58)">
    <rect x="0" y="0" width="204" height="34" rx="17" fill="#E7F3FE" stroke="#B8DEFB"/>
    <circle cx="22" cy="17" r="5" fill="#0A8F54"/>
    <text x="38" y="22" font-size="13.5" font-weight="700" fill="#0B74C4" letter-spacing="1.2">RAZORPAY TEST MODE</text>
  </g>

  <!-- pipeline -->
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <line x1="150" y1="300" x2="1130" y2="300" stroke="#DCE0E6" stroke-width="2"/>
    <g stroke="#B8DEFB" stroke-width="2" fill="none">
      <path d="M256 300 h36"/><path d="M486 300 h36"/><path d="M760 300 h36"/><path d="M990 300 h36"/>
    </g>
    <g fill="#0D94FB">
      <path d="M292 294 l10 6 l-10 6 z"/><path d="M522 294 l10 6 l-10 6 z"/>
      <path d="M796 294 l10 6 l-10 6 z"/><path d="M1026 294 l10 6 l-10 6 z"/>
    </g>

    <!-- node 1 -->
    <g transform="translate(60,258)">
      <rect width="196" height="84" rx="14" fill="#F7F8FA" stroke="#EBECF0"/>
      <text x="98" y="34" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8993A4">LLM / PARSER</text>
      <text x="98" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#172B4D">proposes a draft</text>
    </g>
    <!-- node 2 -->
    <g transform="translate(302,258)">
      <rect width="196" height="84" rx="14" fill="#F7F8FA" stroke="#EBECF0"/>
      <text x="98" y="34" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8993A4">HUMAN</text>
      <text x="98" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#172B4D">signs (Ed25519)</text>
    </g>
    <!-- node 3 - THE GATE (highlighted) -->
    <g transform="translate(536,244)">
      <rect width="208" height="100" rx="16" fill="#E7F3FE" stroke="#0D94FB" stroke-width="2.5"/>
      <text x="104" y="34" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1.4" fill="#0B74C4">DETERMINISTIC GATE</text>
      <text x="104" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#012652">authorizes</text>
      <g transform="translate(0,74)">
        <rect x="34" y="0" width="62" height="22" rx="11" fill="#E4F6ED" stroke="#B7E6CB"/>
        <text x="65" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#0A8F54">ALLOW</text>
        <rect x="112" y="0" width="62" height="22" rx="11" fill="#FCECEE" stroke="#F1C6CC"/>
        <text x="143" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#D64550">BLOCK</text>
      </g>
    </g>
    <!-- node 4 -->
    <g transform="translate(796,258)">
      <rect width="196" height="84" rx="14" fill="#F7F8FA" stroke="#EBECF0"/>
      <text x="98" y="34" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8993A4">RAZORPAY</text>
      <text x="98" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#172B4D">executes (test)</text>
    </g>
    <!-- node 5 -->
    <g transform="translate(1030,258)">
      <rect width="196" height="84" rx="14" fill="#F7F8FA" stroke="#EBECF0"/>
      <text x="98" y="34" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8993A4">RECEIPT + LOG</text>
      <text x="98" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#172B4D">signed, chained</text>
    </g>
  </g>

  <!-- stat chips -->
  <g transform="translate(60,404)">
    <g transform="translate(0,0)">
      <rect width="278" height="96" rx="16" fill="#F7F8FA" stroke="#EBECF0"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="#0D94FB">100%</text>
      <text x="24" y="78" font-size="14.5" fill="#5E6C84">attacks blocked · 9 classes</text>
    </g>
    <g transform="translate(298,0)">
      <rect width="278" height="96" rx="16" fill="#F7F8FA" stroke="#EBECF0"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="#0D94FB">0%</text>
      <text x="24" y="78" font-size="14.5" fill="#5E6C84">false-block on legit traffic</text>
    </g>
    <g transform="translate(596,0)">
      <rect width="278" height="96" rx="16" fill="#F7F8FA" stroke="#EBECF0"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="#0D94FB">0</text>
      <text x="24" y="78" font-size="14.5" fill="#5E6C84">escapes · 20k fuzzed states</text>
    </g>
    <g transform="translate(894,0)">
      <rect width="278" height="96" rx="16" fill="#F7F8FA" stroke="#EBECF0"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="#0D94FB">9</text>
      <text x="24" y="78" font-size="14.5" fill="#5E6C84">machine-readable reason codes</text>
    </g>
  </g>

  <!-- footer ribbon -->
  <text x="640" y="556" text-anchor="middle" font-size="14.5" fill="#8993A4" letter-spacing="0.4">Razorpay AI Buildathon 2026  ·  Track 01  ·  Ed25519 + RFC 8785  ·  FastAPI · SQLite · React  ·  every number reproduced by a command</text>
</svg>
