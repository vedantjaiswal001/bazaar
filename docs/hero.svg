<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" role="img" aria-label="BAZAAR - a deterministic authorization gate for AI-to-AI commerce">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e15"/>
      <stop offset="0.55" stop-color="#0e1220"/>
      <stop offset="1" stop-color="#120f18"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9270"/>
      <stop offset="0.5" stop-color="#ff6a53"/>
      <stop offset="1" stop-color="#ef4a37"/>
    </linearGradient>
    <radialGradient id="glowCoral" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ff6a53" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6a53" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="6" y="6" width="1268" height="588" rx="26" fill="url(#bg)" stroke="#232b3a" stroke-width="1.5"/>
  <ellipse cx="1050" cy="70" rx="360" ry="220" fill="url(#glowCoral)" opacity="0.5"/>

  <!-- header -->
  <text x="60" y="120" font-size="92" font-weight="800" letter-spacing="2" fill="url(#coral)">BAZAAR</text>
  <text x="66" y="168" font-size="27" font-weight="600" fill="#e9eef7">A deterministic authorization gate for AI-to-AI commerce</text>
  <text x="66" y="204" font-size="17.5" fill="#95a0b3">LLMs propose  ·  policies constrain  ·  a deterministic verifier authorizes  ·  nothing probabilistic can widen authority</text>

  <!-- test-mode pill -->
  <g transform="translate(1010,58)">
    <rect x="0" y="0" width="200" height="34" rx="17" fill="#161b27" stroke="#33405a"/>
    <circle cx="22" cy="17" r="5" fill="#4ade80"/>
    <text x="38" y="22" font-size="14" font-weight="600" fill="#c7d0de" letter-spacing="1">RAZORPAY TEST MODE</text>
  </g>

  <!-- pipeline -->
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <!-- connector line behind nodes -->
    <line x1="150" y1="300" x2="1130" y2="300" stroke="#2b3446" stroke-width="2"/>
    <!-- arrows -->
    <g stroke="#3b465c" stroke-width="2" fill="none">
      <path d="M256 300 h36"/><path d="M486 300 h36"/><path d="M760 300 h36"/><path d="M990 300 h36"/>
    </g>
    <g fill="#ff6a53">
      <path d="M292 294 l10 6 l-10 6 z"/><path d="M522 294 l10 6 l-10 6 z"/>
      <path d="M796 294 l10 6 l-10 6 z"/><path d="M1026 294 l10 6 l-10 6 z"/>
    </g>

    <!-- node 1 -->
    <g transform="translate(60,258)">
      <rect width="196" height="84" rx="14" fill="#151a25" stroke="#2a3243"/>
      <text x="98" y="34" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8f9bb0">LLM / PARSER</text>
      <text x="98" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#e9eef7">proposes a draft</text>
    </g>
    <!-- node 2 -->
    <g transform="translate(302,258)">
      <rect width="196" height="84" rx="14" fill="#151a25" stroke="#2a3243"/>
      <text x="98" y="34" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8f9bb0">HUMAN</text>
      <text x="98" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#e9eef7">signs (Ed25519)</text>
    </g>
    <!-- node 3 - THE GATE (highlighted) -->
    <g transform="translate(536,244)">
      <rect x="-6" y="-6" width="220" height="112" rx="18" fill="url(#glowCoral)" filter="url(#soft)" opacity="0.9"/>
      <rect width="208" height="100" rx="16" fill="#1b1620" stroke="#ff6a53" stroke-width="2"/>
      <text x="104" y="34" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1.5" fill="#ff8a72">DETERMINISTIC GATE</text>
      <text x="104" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#f4f7fb">authorizes</text>
      <g transform="translate(0,74)">
        <rect x="34" y="0" width="62" height="22" rx="11" fill="#123021" stroke="#1f7a45"/>
        <text x="65" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#7ff0a8">ALLOW</text>
        <rect x="112" y="0" width="62" height="22" rx="11" fill="#301617" stroke="#8a2f2f"/>
        <text x="143" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#ff8f84">BLOCK</text>
      </g>
    </g>
    <!-- node 4 -->
    <g transform="translate(796,258)">
      <rect width="196" height="84" rx="14" fill="#151a25" stroke="#2a3243"/>
      <text x="98" y="34" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8f9bb0">RAZORPAY</text>
      <text x="98" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#e9eef7">executes (test)</text>
    </g>
    <!-- node 5 -->
    <g transform="translate(1030,258)">
      <rect width="196" height="84" rx="14" fill="#151a25" stroke="#2a3243"/>
      <text x="98" y="34" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8f9bb0">RECEIPT + LOG</text>
      <text x="98" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#e9eef7">signed, chained</text>
    </g>
  </g>

  <!-- stat chips -->
  <g transform="translate(60,404)">
    <g transform="translate(0,0)">
      <rect width="278" height="96" rx="16" fill="#12161f" stroke="#242c3c"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="url(#coral)">100%</text>
      <text x="24" y="76" font-size="14.5" fill="#9aa5b8">attacks blocked · 9 classes</text>
    </g>
    <g transform="translate(298,0)">
      <rect width="278" height="96" rx="16" fill="#12161f" stroke="#242c3c"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="url(#coral)">0%</text>
      <text x="24" y="76" font-size="14.5" fill="#9aa5b8">false-block on legit traffic</text>
    </g>
    <g transform="translate(596,0)">
      <rect width="278" height="96" rx="16" fill="#12161f" stroke="#242c3c"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="url(#coral)">0</text>
      <text x="24" y="76" font-size="14.5" fill="#9aa5b8">escapes · 20k fuzzed states</text>
    </g>
    <g transform="translate(894,0)">
      <rect width="278" height="96" rx="16" fill="#12161f" stroke="#242c3c"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="url(#coral)">9</text>
      <text x="24" y="76" font-size="14.5" fill="#9aa5b8">machine-readable reason codes</text>
    </g>
  </g>

  <!-- footer ribbon -->
  <text x="640" y="556" text-anchor="middle" font-size="14.5" fill="#6f7b90" letter-spacing="0.5">Razorpay AI Buildathon 2026  ·  Track 01  ·  Ed25519 + RFC 8785  ·  FastAPI · SQLite · React  ·  every number reproduced by a command</text>
</svg>
