# One-click Render deploy. A SINGLE Docker web service serves the BAZAAR console
# and its API at one URL, so there is nothing to wire up afterwards. No secrets
# are needed: the interactive demo (gate, attacks, benchmark) runs without any
# Razorpay keys.
#
# In the Render dashboard:  New -> Blueprint -> point at this repo -> Apply.
# When the build finishes, the service URL (e.g. https://bazaar.onrender.com)
# serves the whole app.
services:
  - type: web
    name: bazaar
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
