[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bazaar"
version = "0.1.0"
description = "BAZAAR — deterministic authorization gate for AI-to-AI commerce on Razorpay Test Mode."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vedant", email = "jaiswalvedant2004@gmail.com" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pynacl>=1.5",          # Ed25519 via libsodium — vetted, never hand-rolled
    "rfc8785>=0.1.2",       # RFC 8785 JSON Canonicalization Scheme (JCS)
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "razorpay>=1.4",        # official Razorpay Python SDK (Phase 2)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.98",     # property-based testing + the spend-cap fuzzer
    "ruff>=0.3",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bazaar*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
